<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Item</title>
  <link rel="stylesheet" href="../css/edit-item.css" />
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
</head>
<body>
  <div class="container mt-4">
    <h2>Edit Item</h2>

    <form id="editItemForm" enctype="multipart/form-data"  method="post">
      <input type="hidden" id="itemId" value="" />

      <div class="form-group">
        <label for="itemName">Item Name *</label>
        <input type="text" class="form-control" id="itemName" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" rows="3"></textarea>
      </div>

      <div class="form-row mb-3">
        <div class="form-group col-md-6">
          <label for="pricingMethod">Pricing Method</label>
          <select class="form-control" id="pricingMethod">
            <option value="sellingPrice">Enter Selling Price</option>
            <option value="markupPercent">Use Markup %</option>
          </select>
        </div>
        <div class="form-group col-md-6">
          <label for="pricingInput">Selling Price or Markup % *</label>
          <input type="number" step="0.01" class="form-control" id="pricingInput" required 
                placeholder="e.g., 50.00 or 25.0" />
          <small class="form-text text-muted" id="pricingHint">
            Enter final selling price (e.g., 50.00)
          </small>
          <!-- Hidden field to store cost price for markup calculation -->
          <input type="hidden" id="costPrice" />
        </div>
        <div class="row mb-3">
		  <div class="col-md-12">
		    <label for="mrp">Maximum Retail Price (MRP) - Nu.</label>
		    <input type="number" step="0.01" class="form-control" id="mrp" min="0" 
		           placeholder="Leave blank or same as selling price for no discount" />
		    <small class="form-text text-muted">
		      Original/reference price. If higher than selling price, discount % will show automatically.
		    </small>
		  </div>
		</div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="uom">UOM</label>
          <select class="form-control" id="uom">
            <option value="pcs">pcs</option>
            <option value="kg">kg</option>
            <option value="ltr">ltr</option>
          </select>
        </div>
      </div>

      <div class="form-row mb-3">
        <div class="form-group col-md-6">
          <label for="quantity">Current Stock Quantity *</label>
          <input type="number" class="form-control" id="quantity" min="0" step="1" required />
          <small class="form-text text-muted">Update current stock level</small>
        </div>
        <div class="form-group col-md-6">
          <label for="lowStockThreshold">Low Stock Alert Threshold</label>
          <input type="number" class="form-control" id="lowStockThreshold" min="0" step="1" />
          <small class="form-text text-muted">Alert when stock ≤ this value</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="barcode">Barcode</label>
          <input type="text" class="form-control" id="barcode" />
        </div>
        <div class="form-group col-md-6">
          <label for="supplierItemCode">Supplier Item Code</label>
          <input type="text" class="form-control" id="supplierItemCode" />
        </div>
      </div>

      <div class="form-group">
        <label for="imageFile">Product Image</label>
        <div>
          <img id="currentImage" src="../Images/default.jpg" alt="Current Image" class="img-preview" />
          <input type="file" class="form-control-file" id="imageFile" accept="image/*" />
          <small class="form-text text-muted">Recommended: JPG/PNG, under 2MB</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Update Item</button>
      <button type="button" onclick="
      if (window.history.length > 1) {
        window.history.back();
      }">← Go Back</button>
    </form>

    <div id="message" class="mt-3 alert" style="display:none;"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <script src="../js/edit-item.js"></script>
</body>
</html>
