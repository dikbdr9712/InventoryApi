# ===============================
# The live server. Start with:  java -jar inventory.jar --spring.profiles.active=prod
# Everything secret or server-specific comes from environment variables (see DEPLOY.md):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   APP_PUBLIC_URL (https://your-site), APP_MAIL_ENABLED=true, SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD, APP_MAIL_FROM
#   APP_CORS_ALLOWED_ORIGINS (only when the site and API have different addresses)
#   APP_SMS_ENABLED=true with APP_SMS_URL, or APP_SMS_PROVIDER=twilio with APP_SMS_TWILIO_ACCOUNT_SID,
#   APP_SMS_TWILIO_AUTH_TOKEN, APP_SMS_TWILIO_FROM (optional: "forgot password" codes by text message)
# ===============================

# Behind Nginx with HTTPS: trust its X-Forwarded-* headers (real visitor address, https links)
server.forward-headers-strategy=framework

# The session cookie only travels over HTTPS
server.servlet.session.cookie.secure=true

# No test payments with pretend money on the live site.
# Paying from a bank account stays off until the RMA gateway is connected (then APP_PAYMENTS_BANK_MODE=rma).
app.payments.sandbox.enabled=false
app.payments.bank.mode=${APP_PAYMENTS_BANK_MODE:off}
# With APP_PAYMENTS_BANK_MODE=rma also set APP_PAYMENTS_BANK_RMA_URL, APP_PAYMENTS_BANK_RMA_BENEFICIARY_ID,
# APP_PAYMENTS_BANK_RMA_PRIVATE_KEY and APP_PAYMENTS_BANK_RMA_PUBLIC_KEY (paths to the key files), see DEPLOY.md

# Unsent emails and text messages are not written to the log (they may contain password reset codes and links).
# So "forgot password" offers only the ways that really work: email when APP_MAIL_ENABLED, SMS when APP_SMS_ENABLED.
app.mail.log-body=false
app.sms.log-text=false

# Quieter logs, and error pages never show program details
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
server.error.include-stacktrace=never
server.error.include-message=never

# Only the health check is open on the management side (for monitoring), nothing else
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
