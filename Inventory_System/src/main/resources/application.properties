# ===============================
# Application
# ===============================
spring.application.name=inventory
server.port=${PORT:8080}

# ===============================
# Secrets (passwords, keys) are NOT in this file, because it is in git.
#  - On a developer's computer: Inventory_System/secrets.properties (git ignores it), for example
#        spring.datasource.password=...
#  - On a server: environment variables (SPRING_DATASOURCE_PASSWORD, SPRING_MAIL_PASSWORD, ...)
#    or a secrets.properties next to the jar. See DEPLOY.md.
# ===============================
# Read from the folder the app starts in, and from Inventory_System/ (IntelliJ starts it one folder up, in Inventory/)
spring.config.import=optional:file:./secrets.properties,optional:file:./Inventory_System/secrets.properties

# ===============================
# MySQL database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Tables: built and upgraded by Flyway from src/main/resources/db/migration (V1__..., V2__..., in order).
# Hibernate only CHECKS that the tables match the code at start-up and never changes them.
# A database that existed before Flyway is marked as version 1 the first time (run
# database/upgrade-existing-database.sql on it once first). See database/README.md.
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# (No dialect line needed: Hibernate 7 detects MySQL automatically)

# ===============================
# Static files & uploaded images
# ===============================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Upload sizes (Spring's default is only 1MB per file): product photos and partner documents up to 6MB
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=25MB

# Seller and driver identity documents: kept OUTSIDE the public folders, only admins can open them
app.private-upload-dir=private-uploads

# ===============================
# Login session cookie (the live server switches "secure" on, see application-prod.properties)
# ===============================
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

# ===============================
# The website's address, for links in emails (password reset, order updates)
# ===============================
app.public-url=http://localhost:4200

# ===============================
# Email: off here (emails are written to the log). On the server set app.mail.enabled=true and the
# SMTP server: spring.mail.host, spring.mail.port, spring.mail.username, spring.mail.password
# ===============================
app.mail.enabled=false
app.mail.from=DK/Phar <no-reply@dkphar.bt>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000

# ===============================
# Text messages (SMS): off. See SmsService for app.sms.url.
# ===============================
app.sms.enabled=false

# ===============================
# Online payments: the TEST gateway (no real money) is on here, and off on the live server
# ===============================
app.payments.sandbox.enabled=true

# ===============================
# Logging (DEBUG is noisy; the live server uses INFO)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# JSON
# ===============================
# Prevent Jackson from trying to serialize uninitialized Hibernate proxies
spring.jackson.serialization.fail-on-empty-beans=false

app.returns.window-days=7
app.returns.roles=ADMIN,MANAGER
