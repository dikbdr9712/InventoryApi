# =====================================================================================
# DP DrukBazaars behind Nginx with HTTPS: one address for the website, /api and /uploads.
#   sudo cp deploy/nginx-drukbazaars.conf /etc/nginx/sites-available/drukbazaars
#   sudo ln -s /etc/nginx/sites-available/drukbazaars /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d drukbazaars.bt -d www.drukbazaars.bt     (free HTTPS certificate, renews itself)
#   sudo nginx -t && sudo systemctl reload nginx
# Replace drukbazaars.bt with your domain everywhere below.
# =====================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name drukbazaars.bt www.drukbazaars.bt;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }       # always HTTPS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drukbazaars.bt www.drukbazaars.bt;

    # filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/drukbazaars.bt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drukbazaars.bt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # browsers: HTTPS only from now on; no framing by other sites; no guessing of file types
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # photos and documents up to the application's limit
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the Angular website (the contents of dist/inventory-project/browser)
    root /var/www/drukbazaars;
    index index.html;

    # the API: Spring Boot on this server, port 8080 (not reachable from outside)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # product photos uploaded through the application
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # the page itself is never cached, so a new version shows at once
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # program files have a fingerprint in their name: cache them for a long time
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # every other address is a page of the Angular app (for example /orders/16)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
